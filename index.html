<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어디 갈까? · 국내 여행지 추천</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1d2a2f;
    --muted: #6b7478;
    --sea: #dbe8ef;
    --land-stroke: #ffffff;
    --accent: #e4572e;
    --accent-soft: #fde4da;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .view { display: none; }
  .view.show { display: block; }

  /* ---------- 지도 화면 ---------- */
  #mapView {
    height: 100vh;
    height: 100dvh;
    background: var(--sea);
    position: relative;
    overflow: hidden;
  }
  .map-title {
    position: absolute;
    top: 24px; left: 28px;
    z-index: 2;
    pointer-events: none;
  }
  .map-title h1 { font-size: 30px; letter-spacing: -0.8px; }
  .map-title p { color: var(--muted); margin-top: 4px; font-size: 15px; }
  #map { width: 100%; height: 100%; display: block; }

  .province {
    stroke: var(--land-stroke);
    stroke-width: 1;
    stroke-linejoin: round;
    transition: filter .15s;
  }
  .province:hover { filter: brightness(0.94); }
  .fallback-land { fill: #cfe0c6; stroke: #9db08f; stroke-width: 1.2; stroke-linejoin: round; }

  .city { cursor: pointer; }
  .city .dot { fill: var(--ink); stroke: #fff; stroke-width: 2; transition: fill .15s; }
  .city .halo { fill: var(--accent); opacity: 0; transition: opacity .15s; }
  .city text {
    font-size: 12px;
    font-weight: 700;
    fill: var(--ink);
    paint-order: stroke;
    stroke: rgba(255,255,255,.9);
    stroke-width: 4px;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .city:hover .dot, .city:focus-visible .dot { fill: var(--accent); }
  .city:hover .halo, .city:focus-visible .halo { opacity: .3; }
  .city:focus { outline: none; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    opacity: 0;
    transform: translate(-50%, -130%);
    transition: opacity .1s;
    white-space: nowrap;
    z-index: 3;
  }
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .hint {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(6px);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--muted);
  }

  /* ---------- 상세 화면 ---------- */
  #cityView { min-height: 100vh; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .hero {
    background: var(--ink);
    color: #fff;
    padding: 20px 24px 40px;
  }
  .hero-inner { max-width: 960px; margin: 0 auto; }
  .back {
    border: none;
    background: rgba(255,255,255,.12);
    color: #fff;
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .back:hover { background: rgba(255,255,255,.22); }
  .hero .region { color: #ffb59c; font-weight: 600; margin-top: 28px; font-size: 14px; }
  .hero h2 { font-size: 44px; letter-spacing: -1px; margin: 4px 0 10px; }
  .hero p { color: rgba(255,255,255,.75); line-height: 1.6; max-width: 600px; }

  .content { max-width: 960px; margin: 0 auto; padding: 32px 24px 60px; }
  .section + .section { margin-top: 40px; }
  .section h3 { font-size: 22px; margin-bottom: 16px; letter-spacing: -0.4px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    animation: fadeUp .3s ease both;
  }
  .card-body { padding: 16px 20px 20px; display: flex; flex-direction: column; flex: 1; }

  /* 사진 영역 */
  .photo {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(110deg, #ece7dd 30%, #f6f2ea 50%, #ece7dd 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
    overflow: hidden;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .4s, transform .4s;
  }
  .photo.loaded { animation: none; }
  .photo.loaded img { opacity: 1; }
  .card:hover .photo img { transform: scale(1.04); }
  .photo .ph-emoji {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    opacity: 0;
    transition: opacity .3s;
  }
  .photo.none { animation: none; background: linear-gradient(135deg, #f3e3d8, #dbe8ef); }
  .photo.none .ph-emoji { opacity: .8; }
  .photo .credit {
    position: absolute; right: 8px; bottom: 8px;
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,.45);
    padding: 2px 7px;
    border-radius: 6px;
    text-decoration: none;
    opacity: 0;
    transition: opacity .2s;
  }
  .photo.loaded .credit { opacity: .9; }
  .photo .credit:hover { background: rgba(0,0,0,.7); color: #fff; }
  .photo.none .ph-emoji { display: none; }
  .add-photo {
    position: absolute; inset: 10px;
    border: 2px dashed rgba(29,42,47,.25);
    border-radius: 12px;
    background: rgba(255,255,255,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .add-photo:hover { background: rgba(255,255,255,.65); border-color: var(--accent); }
  .add-photo .add-icon { font-size: 30px; }
  .add-photo b { font-size: 15px; }
  .add-photo small { font-size: 12px; color: var(--muted); }
  .photo-actions {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 6px;
    opacity: 0;
    transition: opacity .2s;
  }
  .photo:hover .photo-actions, .photo:focus-within .photo-actions { opacity: 1; }
  @media (hover: none) { .photo.loaded .photo-actions { opacity: 1; } }
  .photo-btn {
    border: none;
    background: rgba(255,255,255,.9);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .photo-btn:hover { background: #fff; color: var(--accent); }
  .photo .credit.mine { background: var(--accent); opacity: 1; }
  .photo.saving::after {
    content: "저장 중…";
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.7);
    font-weight: 600;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card .tag {
    align-self: flex-start;
    font-size: 12px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 9px;
    border-radius: 6px;
  }
  .card h4 { font-size: 18px; margin: 10px 0 6px; }
  .card p { color: var(--muted); line-height: 1.55; font-size: 15px; flex: 1; }
  .card-body > a {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
  }
  .card-body > a:hover { color: var(--accent); }

  .other { margin-top: 48px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .region-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid #e6e1d6;
  }
  .region-name { font-size: 13px; font-weight: 700; color: var(--muted); }
  @media (max-width: 640px) {
    .region-row { grid-template-columns: 1fr; gap: 6px; }
  }
  .chip {
    border: 1px solid #d8d3c8;
    background: transparent;
    font: inherit;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 640px) {
    .map-title { top: 16px; left: 18px; }
    .map-title h1 { font-size: 24px; }
    .hero h2 { font-size: 34px; }
  }
</style>
</head>
<body>

<!-- 1) 첫 화면: 지도 -->
<section id="mapView" class="view show">
  <div class="map-title">

function makeProjection(rings, width, height) {
  let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
  rings.forEach(r => r.forEach(([lon, lat]) => {
    if (lon > 130.5) return; // 울릉도·독도는 범위 계산에서 제외
    minLon = Math.min(minLon, lon); maxLon = Math.max(maxLon, lon);
    minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
  }));
  const k = Math.cos((36 * Math.PI) / 180); // 위도 보정
  const geoW = (maxLon - minLon) * k, geoH = maxLat - minLat;
  const padTop = width < 640 ? 90 : 40, pad = 30;
  const scale = Math.min((width - pad * 2) / geoW, (height - padTop - pad - 50) / geoH);
  const offX = (width - geoW * scale) / 2;
  const offY = padTop + (height - padTop - 50 - geoH * scale) / 2;
  return (lon, lat) => [offX + (lon - minLon) * k * scale, offY + (maxLat - lat) * scale];
}

function ringToPath(ring) {
  return ring.map(([lon, lat], i) => {
    const [x, y] = proj(lon, lat);
    return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }).join("") + "Z";
}

function el(tag, attrs = {}, parent = svg) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}

// GeoJSON feature → 외곽 링 목록
function featureRings(f) {
  const g = f.geometry;
  if (g.type === "Polygon") return g.coordinates;
  if (g.type === "MultiPolygon") return g.coordinates.flat();
  return [];
}

/* =========================================================
   4. 지도 그리기
   ========================================================= */
let geoData = null;
const tooltip = document.getElementById("tooltip");

function drawMap() {
  const { width, height } = svg.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = "";

  if (geoData) {
    const allRings = geoData.features.flatMap(featureRings);
    proj = makeProjection(allRings, width, height);
    geoData.features.forEach(f => {
      const name = f.properties.name || f.properties.NAME || "";
      const d = featureRings(f)
        .filter(r => r[0][0] <= 130.5) // 울릉도·독도 생략
        .map(ringToPath).join("");
      const p = el("path", { d, class: "province", fill: provinceColor(name), "fill-rule": "evenodd" });
      p.addEventListener("mousemove", e => showTip(e, name));
      p.addEventListener("mouseleave", hideTip);
    });
  } else {
    const rings = [FALLBACK.mainland, ...FALLBACK.islands];
    proj = makeProjection(rings, width, height);
    rings.forEach(r => el("path", { d: ringToPath(r), class: "fallback-land" }));
  }

  drawCities();
}

function drawCities() {
  CITIES.forEach(city => {
    const [x, y] = proj(city.lon, city.lat);
    const g = el("g", { class: "city", tabindex: 0, role: "button", "aria-label": `${city.name} 여행지 보기` });
    el("circle", { cx: x, cy: y, r: 14, class: "halo" }, g);
    el("circle", { cx: x, cy: y, r: 5.5, class: "dot" }, g);
    el("text", { x: x + city.labelDx, y: y + city.labelDy }, g).textContent = city.name;

    g.addEventListener("click", () => goCity(city.id));
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goCity(city.id); }
    });
  });
}

function showTip(e, text) {
  const box = svg.getBoundingClientRect();
  tooltip.textContent = text;
  tooltip.style.left = e.clientX - box.left + "px";
  tooltip.style.top = e.clientY - box.top + "px";
  tooltip.style.opacity = 1;
}
function hideTip() { tooltip.style.opacity = 0; }

async function loadMap() {
  try {
    const res = await fetch(GEOJSON_URL);
    if (!res.ok) throw new Error(res.status);
    geoData = await res.json();
  } catch (err) {
    console.warn("경계 데이터를 불러오지 못해 기본 윤곽선을 사용합니다.", err);
  }
  document.getElementById("loading").remove();
  drawMap();
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (isMapVisible()) drawMap(); }, 150);
});

/* =========================================================
   5. 화면 전환 (주소 #/city/부산 형태 → 뒤로가기 지원)
   ========================================================= */
const mapView = document.getElementById("mapView");
const cityView = document.getElementById("cityView");
const isMapVisible = () => mapView.classList.contains("show");

function goCity(id) { location.hash = `#/city/${id}`; }
function goMap() { location.hash = ""; }

function route() {
  const m = location.hash.match(/^#\/city\/(\w+)/);
  const city = m && CITIES.find(c => c.id === m[1]);
  if (city) {
    mapView.classList.remove("show");
    cityView.classList.add("show");
    renderCity(city);
    window.scrollTo(0, 0);
  } else {
    cityView.classList.remove("show");
    mapView.classList.add("show");
    hideTip();
    if (proj) drawMap();
  }
}
window.addEventListener("hashchange", route);

/* =========================================================
   6. 도시 상세 페이지
   ========================================================= */
function mapLink(cityName, placeName) {
  return `https://map.naver.com/p/search/${encodeURIComponent(cityName + " " + placeName)}`;
}

function cards(city, list, emoji) {
  return list.map((it, i) => `
    <article class="card" style="animation-delay:${i * 50}ms">
      <div class="photo" data-city="${city.name}" data-name="${it.name}" data-img="${it.img || ""}">
        <span class="ph-emoji">${emoji}</span>
      </div>
      <div class="card-body">
        <span class="tag">${it.tag}</span>
        <h4>${it.name}</h4>
        <p>${it.desc}</p>
        <a href="${mapLink(city.name, it.name)}" target="_blank" rel="noopener">지도에서 보기 →</a>
      </div>
    </article>`).join("");
}

/* =========================================================
   7. 사진 자동 검색 (위키백과 → 위키미디어 공용)
   - 화면에 카드가 보일 때만 불러오고, 결과는 브라우저에 저장해 둡니다.
   - 직접 고른 사진이 있으면 데이터의 네 번째 값으로 넣으세요.
   ========================================================= */
const IMG_CACHE_KEY = "travel-photo-cache-v1";
let photoCache = {};
try { photoCache = JSON.parse(localStorage.getItem(IMG_CACHE_KEY)) || {}; } catch (e) {}
function saveCache() {
  try { localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(photoCache)); } catch (e) {}
}

// "해운대 · 블루라인파크" → "해운대", "선유도 (고군산군도)" → "선유도"
const cleanName = s => s.split("·")[0].replace(/\(.*?\)/g, "").trim();
const isPhoto = url => url && /\.(jpe?g|png|webp)/i.test(url) && !/\.svg/i.test(url);

async function fromWikipedia(query) {
  const url = "https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*" +
    "&generator=search&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=800" +
    "&gsrsearch=" + encodeURIComponent(query);
  const data = await (await fetch(url)).json();
  const page = Object.values(data.query?.pages || {})[0];
  const src = page?.thumbnail?.source;
  if (!isPhoto(src)) return null;
  return { src, link: "https://ko.wikipedia.org/wiki/" + encodeURIComponent(page.title), by: "위키백과" };
}

async function fromCommons(query) {
  const url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
    "&generator=search&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=800" +
    "&gsrsearch=" + encodeURIComponent(query + " filetype:bitmap");
  const data = await (await fetch(url)).json();
  const pages = Object.values(data.query?.pages || {}).sort((a, b) => a.index - b.index);
  for (const p of pages) {
    const info = p.imageinfo?.[0];
    if (info && /\.jpe?g$/i.test(info.url)) {
      return { src: info.thumburl || info.url, link: info.descriptionurl, by: "Wikimedia" };
    }
  }
  return null;
}

async function findPhoto(city, name) {
  const key = city + "|" + name;
  if (key in photoCache) return photoCache[key];
  const q = cleanName(name);
  const cityQ = cleanName(city).replace(/시$/, "");
  const attempts = [
    () => fromWikipedia(`${q} ${cityQ}`),
    () => fromWikipedia(q),
    () => fromCommons(`${q} ${cityQ}`),
    () => fromCommons(q),
  ];
  let result = null, failed = false;
  for (const attempt of attempts) {
    try { result = await attempt(); } catch (e) { result = null; failed = true; }
    if (result) break;
  }
  // 네트워크 오류일 때는 저장하지 않고 다음에 다시 시도
  if (result || !failed) { photoCache[key] = result; saveCache(); }
  return result;
}

// 동시에 너무 많이 요청하지 않도록 4개씩만
const queue = [];
let running = 0;
function enqueue(task) {
  queue.push(task);
  runQueue();
}
function runQueue() {
  while (running < 4 && queue.length) {
    const task = queue.shift();
    running++;
    task().finally(() => { running--; runQueue(); });
  }
}

/* =========================================================
   8. 내 사진 올리기 (IndexedDB에 저장 → 이 브라우저에서 계속 유지)
   ========================================================= */
const DB_NAME = "travel-photos", STORE = "photos";
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}
async function dbRun(mode, action) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const req = action(tx.objectStore(STORE));
    tx.oncomplete = () => resolve(req.result);
    tx.onerror = () => reject(tx.error);
  });
}
const getMyPhoto = key => dbRun("readonly", s => s.get(key)).catch(() => null);
const saveMyPhoto = (key, blob) => dbRun("readwrite", s => s.put(blob, key));
const deleteMyPhoto = key => dbRun("readwrite", s => s.delete(key));
const photoKey = box => box.dataset.city + "|" + box.dataset.name;

// 큰 사진은 긴 변 1200px로 줄여서 JPEG로 저장 (용량 절약)
function resizeImage(file, max = 1200) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * ratio);
      canvas.height = Math.round(img.naturalHeight * ratio);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => (b ? resolve(b) : reject(new Error("변환 실패"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없어요")); };
    img.src = url;
  });
}

// 파일 선택 창 (하나를 모든 카드가 같이 씀)
const filePicker = document.createElement("input");
filePicker.type = "file";
filePicker.accept = "image/*";   // 휴대폰에서는 '사진 찍기 / 앨범' 선택이 나와요
filePicker.hidden = true;
document.body.appendChild(filePicker);
let pickingBox = null;

function pickPhotoFor(box) {
  pickingBox = box;
  filePicker.value = "";
  filePicker.click();
}

filePicker.addEventListener("change", async () => {
  const file = filePicker.files[0];
  const box = pickingBox;
  if (!file || !box) return;
  box.classList.add("saving");
  try {
    const blob = await resizeImage(file);
    await saveMyPhoto(photoKey(box), blob);
    setPhoto(box, { src: URL.createObjectURL(blob) }, true);
  } catch (err) {
    alert("사진을 저장하지 못했어요. 다른 사진으로 시도해 주세요.");
    console.error(err);
  } finally {
    box.classList.remove("saving");
  }
});

/* =========================================================
   9. 사진 칸 그리기
   - photo가 없으면 '사진 추가하기' 버튼
   - mine = true면 '변경 / 삭제' 버튼
   ========================================================= */
function button(cls, text, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.innerHTML = text;
  b.addEventListener("click", e => { e.stopPropagation(); onClick(); });
  return b;
}

function setPhoto(box, photo, mine = false) {
  box.querySelectorAll("img, .credit, .photo-actions, .add-photo").forEach(n => n.remove());
  box.classList.remove("loaded", "none");
  if (box._objectUrl) { URL.revokeObjectURL(box._objectUrl); box._objectUrl = null; }

  if (!photo) {
    box.classList.add("none");
    box.appendChild(button("add-photo",
      `<span class="add-icon">📷</span><b>사진 추가하기</b><small>직접 찍은 사진을 올려주세요</small>`,
      () => pickPhotoFor(box)));
    return;
  }

  const img = new Image();
  img.alt = box.dataset.name;
  img.referrerPolicy = "no-referrer";
  img.onload = () => box.classList.add("loaded");
  img.onerror = () => setPhoto(box, null);
  img.src = photo.src;
  if (mine) box._objectUrl = photo.src;
  box.appendChild(img);

  const actions = document.createElement("div");
  actions.className = "photo-actions";
  if (mine) {
    const badge = document.createElement("span");
    badge.className = "credit mine";
    badge.textContent = "📷 내 사진";
    box.appendChild(badge);
    actions.append(
      button("photo-btn", "변경", () => pickPhotoFor(box)),
      button("photo-btn", "삭제", async () => {
        if (!confirm("내 사진을 삭제할까요?")) return;
        await deleteMyPhoto(photoKey(box));
        loadOne(box); // 원래 사진(검색 결과)으로 되돌리기
      })
    );
  } else {
    if (photo.link) {
      const a = document.createElement("a");
      a.className = "credit";
      a.href = photo.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "📷 " + photo.by;
      box.appendChild(a);
    }
    actions.append(button("photo-btn", "내 사진으로 바꾸기", () => pickPhotoFor(box)));
  }
  box.appendChild(actions);
}

// 우선순위: 내 사진 → 데이터에 넣은 사진 → 자동 검색
async function loadOne(box) {
  const mine = await getMyPhoto(photoKey(box));
  if (mine) return setPhoto(box, { src: URL.createObjectURL(mine) }, true);
  if (box.dataset.img) return setPhoto(box, { src: box.dataset.img });
  enqueue(async () => setPhoto(box, await findPhoto(box.dataset.city, box.dataset.name)));
}

const photoObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    photoObserver.unobserve(entry.target);
    loadOne(entry.target);
  });
}, { rootMargin: "200px" });

function loadPhotos(container) {
  queue.length = 0; // 이전 도시의 대기 중 요청 취소
  photoObserver.disconnect();
  container.querySelectorAll(".photo").forEach(box => photoObserver.observe(box));
}

function renderCity(city) {
  const others = CITIES.filter(c => c.id !== city.id);
  cityView.innerHTML = `
    <div class="hero">
      <div class="hero-inner">
        <button class="back" id="backBtn">← 지도로 돌아가기</button>
        <div class="region">${city.region}</div>
        <h2>${city.name}</h2>
        <p>${city.desc}</p>
      </div>
    </div>
    <div class="content">
      <section class="section">
        <h3>📍 가볼 만한 곳</h3>
        <div class="grid">${cards(city, city.spots, "📍")}</div>
      </section>
      <section class="section">
        <h3>🍜 맛집 · 먹거리</h3>
        <div class="grid">${cards(city, city.foods, "🍜")}</div>
      </section>
      <section class="other">
        <h3 style="font-size:16px;margin-bottom:12px;color:var(--muted)">다른 도시 둘러보기</h3>
        ${[...new Set(others.map(c => c.region))].map(region => `
          <div class="region-row">
            <span class="region-name">${region}</span>
            <div class="chips">
              ${others.filter(c => c.region === region)
                .map(c => `<button class="chip" data-id="${c.id}">${c.name}</button>`).join("")}
            </div>
          </div>`).join("")}
      </section>
    </div>`;
  document.getElementById("backBtn").addEventListener("click", goMap);
  cityView.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => goCity(b.dataset.id)));
  loadPhotos(cityView);
}

/* 시작 */
route();
loadMap();
</script>
